<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acacia Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 28px;
        }

        #titleLogo {
            max-height: 80px;
            margin-bottom: 20px;
        }

        .mode-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .mode-selector select {
            padding: 6px 10px;
        }

        .container {
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        .board-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        canvas {
            border: 2px solid #444;
            background: #2a2a2a;
            cursor: grab;
        }

        canvas.dragging {
            cursor: grabbing;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            padding: 15px;
            background: #222;
            border-radius: 8px;
        }

        .controls.hidden {
            display: none;
        }

        button {
            padding: 8px 16px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        button:hover {
            background: #0052a3;
        }

        button:active {
            background: #003d7a;
        }

        button:disabled {
            background: #666;
            color: #aaa;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .speed-control input {
            width: 100px;
        }

        .speed-control label {
            font-size: 14px;
        }

        .bot-selector {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .bot-selector label {
            font-size: 14px;
            min-width: 40px;
        }

        select {
            padding: 6px 10px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .supply-panels {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .supply-panel {
            background: #222;
            padding: 15px;
            border-radius: 8px;
            min-width: 200px;
        }

        .supply-panel h3 {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .supply-items {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 14px;
        }

        .supply-item {
            display: flex;
            justify-content: space-between;
        }

        .draggable-pieces {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .draggable-piece {
            width: 50px;
            height: 50px;
            background: #333;
            border: 2px solid #555;
            border-radius: 4px;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            font-size: 24px;
            transition: opacity 0.2s;
        }

        .draggable-piece.disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .draggable-piece:not(.disabled):hover {
            border-color: #77ff;
            background: #444;
        }

        .draggable-piece:active:not(.disabled) {
            cursor: grabbing;
        }

        .current-player {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            padding: 10px;
            background: #222;
            border-radius: 8px;
        }

        .current-player.p1 {
            color: #4499ff;
        }

        .current-player.p2 {
            color: #ff6666;
        }

        .game-status {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            padding: 10px;
            background: #222;
            border-radius: 8px;
            color: #ffaa00;
        }

        .info-panel {
            background: #222;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            max-width: 300px;
        }

        .info-panel h3 {
            margin-bottom: 10px;
        }

        .info-panel p {
            margin-bottom: 5px;
        }

        .analyse-panel {
            background: #222;
            padding: 20px;
            border-radius: 8px;
            min-width: 300px;
            display: none;
        }

        .analyse-panel.visible {
            display: block;
        }

        .analyse-panel h3 {
            margin-bottom: 15px;
            font-size: 18px;
        }

        .analyse-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }

        .analyse-input-group label {
            font-size: 14px;
            min-width: 100px;
        }

        .analyse-input-group input {
            padding: 6px 10px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            width: 100px;
        }

        .analyse-input-group button {
            flex: 1;
        }

        .analyse-progress {
            margin: 15px 0;
            display: none;
        }

        .analyse-progress.visible {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 24px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #0066cc, #0052a3);
            width: 0%;
            transition: width 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
            font-weight: bold;
        }

        .progress-text {
            text-align: center;
            font-size: 13px;
            color: #aaa;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
            display: none;
        }

        .stats-grid.visible {
            display: grid;
        }

        .stat-item {
            background: #333;
            padding: 12px;
            border-radius: 4px;
            border-left: 3px solid #0066cc;
        }

        .stat-item.p2-stat {
            border-left-color: #ff6666;
        }

        .stat-label {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            margin-top: 5px;
            color: #fff;
        }

    </style>
</head>
<body>
    <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
        <img id="titleLogo" src="images/game_logo.png" alt="Acacia">
        <div style="font-size: 12px; color: #888;">v<span id="versionNumber">1</span></div>
    </div>

    <div class="mode-selector">
        <label>Mode:</label>
        <select id="modeSelect">
            <option value="watch">Watch</option>
            <option value="analyse">Analyse</option>
        </select>
        <div class="bot-selector" style="margin-left: 40px;">
            <label>Player 1:</label>
            <select id="bot1Select">
                <option value="random">Random</option>
                <option value="mcts">MCTS</option>
                <option value="human">Human</option>
            </select>
            <label style="margin-left: 20px;">Player 2:</label>
            <select id="bot2Select">
                <option value="random">Random</option>
                <option value="mcts">MCTS</option>
                <option value="human">Human</option>
            </select>
        </div>
        <button id="btnPlay" style="margin-left: 40px;">Play</button>
    </div>

    <div class="container">
        <div class="board-container">
            <div class="current-player" id="currentPlayer">Player 1's turn</div>
            <canvas id="board" width="540" height="540" style="border: 2px solid #444; background: #2a2a2a;"></canvas>
            <div class="controls" id="controls">
                <button id="btnPause">Pause</button>
                <button id="btnStep">Step</button>
                <button id="btnReset">Reset</button>
                <div class="speed-control">
                    <label>Speed (ms):</label>
                    <input id="speedSlider" type="range" min="100" max="2000" step="100" value="500">
                </div>
            </div>
        </div>

        <div>
            <div class="game-status" id="gameStatus">Game ready</div>
            <button id="playAgainBtn" style="display:none; margin-top: 10px; width: 100%; padding: 12px;">Play Again</button>
            <div class="supply-panels" id="supplyPanels"></div>

            <div class="analyse-panel" id="analysePanel">
                <h3>Game Analysis</h3>
                <div class="analyse-input-group">
                    <label for="iterationsInput">Iterations:</label>
                    <input type="number" id="iterationsInput" min="1" max="10000" value="20">
                    <button id="btnRunAnalysis">Run Analysis</button>
                </div>
                <div class="analyse-progress" id="analyseProgress">
                    <div id="currentGameStatus" style="margin-bottom: 15px; text-align: center; color: #ffaa00; font-size: 16px; font-weight: bold;">Running Game 0 of 0...</div>
                    <div class="progress-bar">
                        <div class="progress-bar-fill" id="progressBarFill"></div>
                    </div>
                </div>
                <div class="stats-grid" id="statsGrid"></div>
            </div>

            <div class="info-panel">
                <h3>How to Play</h3>
                <p><strong>Goal:</strong> Form 4-in-a-row or place all pieces</p>
                <p><strong>Blue:</strong> Player 1 (Owls & Houses)</p>
                <p><strong>Red:</strong> Player 2 (Squirrels & Houses)</p>
                <p><strong>Yellow:</strong> Koala (breaks lines, can't be ejected)</p>
                <p id="humanHint" style="display:none; color: #ffff00; margin-top: 10px;"><strong>Drag pieces from your supply to the board!</strong></p>
            </div>
        </div>
    </div>

    <!-- JavaScript modules loaded in dependency order -->
    <script src="version.js"></script>
    <script src="js/engine/constants.js"></script>
    <script src="js/engine/game.js"></script>
    <script src="js/engine/bots.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/session.js"></script>
    <script src="js/gameloop.js"></script>
    <script src="js/analysis.js"></script>
    <script src="app.js"></script>
</body>
</html>
